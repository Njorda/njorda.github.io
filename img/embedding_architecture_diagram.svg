<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gpuGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8e8e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cpuGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6ee5dd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="apiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#45b7d1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#67c5e0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000033"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">
    One Encoder Model → Multiple Classifiers via API
  </text>
  
  <!-- Traditional Approach (Left Side) -->
  <text x="200" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#666">
    Traditional: Multiple Fine-tuned Models
  </text>
  
  <!-- GPU Servers (Traditional) -->
  <rect x="50" y="90" width="120" height="80" rx="8" fill="url(#gpuGradient)" filter="url(#shadow)" stroke="#333" stroke-width="1"/>
  <text x="110" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">GPU Server 1</text>
  <text x="110" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Fine-tuned</text>
  <text x="110" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">BERT Model</text>
  <text x="110" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Classifier A</text>
  
  <rect x="230" y="90" width="120" height="80" rx="8" fill="url(#gpuGradient)" filter="url(#shadow)" stroke="#333" stroke-width="1"/>
  <text x="290" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">GPU Server 2</text>
  <text x="290" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Fine-tuned</text>
  <text x="290" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">BERT Model</text>
  <text x="290" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Classifier B</text>
  
  <rect x="140" y="200" width="120" height="80" rx="8" fill="url(#gpuGradient)" filter="url(#shadow)" stroke="#333" stroke-width="1"/>
  <text x="200" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">GPU Server 3</text>
  <text x="200" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Fine-tuned</text>
  <text x="200" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">BERT Model</text>
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Classifier C</text>
  
  <!-- Cost indicators (Traditional) -->
  <text x="200" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d32f2f">
    💰 High GPU Costs
  </text>
  <text x="200" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d32f2f">
    ⚡ High Energy Usage
  </text>
  <text x="200" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d32f2f">
    🔧 Complex Maintenance
  </text>
  
  <!-- Divider -->
  <line x1="400" y1="60" x2="400" y2="550" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="500" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#666">
    VS
  </text>
  
  <!-- Proposed Approach (Right Side) -->
  <text x="700" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#666">
    Efficient: One Encoder + API
  </text>
  
  <!-- Single Encoder Model -->
  <rect x="640" y="90" width="120" height="100" rx="8" fill="url(#apiGradient)" filter="url(#shadow)" stroke="#333" stroke-width="2"/>
  <text x="700" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Encoder Model</text>
  <text x="700" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">(GPU Server)</text>
  <text x="700" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Embedding API</text>
  <text x="700" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Serves All Classifiers</text>
  
  <!-- API Arrows -->
  <path d="M 640 140 Q 580 140 520 220" fill="none" stroke="#45b7d1" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M 640 140 Q 580 140 520 300" fill="none" stroke="#45b7d1" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M 640 140 Q 580 140 520 380" fill="none" stroke="#45b7d1" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#45b7d1"/>
    </marker>
  </defs>
  
  <!-- CPU-based Classifiers -->
  <rect x="420" y="200" width="100" height="60" rx="8" fill="url(#cpuGradient)" filter="url(#shadow)" stroke="#333" stroke-width="1"/>
  <text x="470" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">CPU Server</text>
  <text x="470" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Classifier A</text>
  <text x="470" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">(Lightweight)</text>
  
  <rect x="420" y="280" width="100" height="60" rx="8" fill="url(#cpuGradient)" filter="url(#shadow)" stroke="#333" stroke-width="1"/>
  <text x="470" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">CPU Server</text>
  <text x="470" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Classifier B</text>
  <text x="470" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">(Lightweight)</text>
  
  <rect x="420" y="360" width="100" height="60" rx="8" fill="url(#cpuGradient)" filter="url(#shadow)" stroke="#333" stroke-width="1"/>
  <text x="470" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">CPU Server</text>
  <text x="470" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Classifier C</text>
  <text x="470" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">(Lightweight)</text>
  
  <!-- Benefits (Proposed) -->
  <text x="700" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2e7d32">
    💡 Lower Costs
  </text>
  <text x="700" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2e7d32">
    ⚡ Energy Efficient
  </text>
  <text x="700" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2e7d32">
    🎯 Centralized Management
  </text>
  <text x="700" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2e7d32">
    🔧 Easy Scaling
  </text>
  
  <!-- Data Flow Labels -->
  <text x="580" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#45b7d1" font-weight="bold">
    Embeddings
  </text>
  <text x="580" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#45b7d1" font-weight="bold">
    via API
  </text>
  
  <!-- Key insight box -->
  <rect x="50" y="480" width="900" height="80" rx="10" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    Key Advantage: Resource Efficiency
  </text>
  <text x="500" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#666">
    One shared encoder model provides embeddings to multiple lightweight CPU-based classifiers,
  </text>
  <text x="500" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#666">
    dramatically reducing GPU requirements, costs, and complexity while maintaining performance.
  </text>
</svg>